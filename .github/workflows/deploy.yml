name: Deploy Revolver App

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # [ДОБАВЛЕНО] Настраиваем Java-окружение на машине GitHub
      - name: Set up JDK 17  # Укажите вашу версию Java (11, 17, 21 и т.д.)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Кэширование зависимостей, чтобы сборка шла быстрее

      # [ДОБАВЛЕНО] Собираем проект (компилируем код и создаем тот самый jar в папке target)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: dakucheri/revolver-app:latest

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ikornilov/IntraServiceRevolver
            docker compose pull
            docker compose up -d --remove-orphans